name: Generate Lockfile

on:
  push:
    branches: [chore/npm-lockfile-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: chore/npm-lockfile-hardening

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate package-lock
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit package-lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git commit -m "chore: add npm lockfile"
          git push origin HEAD:chore/npm-lockfile-hardening
